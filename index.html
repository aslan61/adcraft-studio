  <head>
    <meta charset="UTF-8" />

    <title>AdCraft Studio — Mobile App Ad Creative Synthesizer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Transforms raw mobile app screenshots and screen recording videos into high-converting, platform-ready marketing creatives for TikTok, Reels, and App Stores." />
    <meta property="og:title" content="AdCraft Studio — Mobile App Ad Creative Synthesizer" />
    <meta property="og:description" content="Transforms raw mobile app screenshots and screen recording videos into high-converting, platform-ready marketing creatives for TikTok, Reels, and App Stores." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        function isBenignWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err || '');
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('[vite]') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignWsError(event.error) || isBenignWsError(event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && a.message) || a || ''); }).join(' ');
          if (isBenignWsError(msg)) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && a.message) || a || ''); }).join(' ');
          if (isBenignWsError(msg)) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };
      })();
    </script>
  </head>
  <body class="bg-[#07090F] text-[#E1E2EC] antialiased selection:bg-indigo-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
